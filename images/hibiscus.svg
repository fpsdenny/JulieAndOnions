      <path d="M 0 0 L 5.6 5.6" stroke="#ead7b9" stroke-width="0.95" stroke-linecap="round"/>
      <g fill="#c9945f">
        <circle cx="6.4" cy="5.2" r="0.85"/>
        <circle cx="5.2" cy="6.4" r="0.85"/>
        <circle cx="6.9" cy="6.6" r="0.8"/>
