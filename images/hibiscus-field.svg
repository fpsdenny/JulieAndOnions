  <!-- SCATTER tile for the drift that enters over the empty top right of the About page.
       Pink hibiscus, the flower Hayden keeps. Five broad petals, a deep throat and
       the staminal column that identifies the species. Palette: petals #c9a3bd,
       throat #6b2f5c, column #ead7b9, anthers #c9945f, stem and leaves #8f7252.
